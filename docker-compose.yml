services:
  mongo:
    container_name: mongo
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - db-data:/data/db
  
  node-app:
    container_name: node-app
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - mongo

# Volume is used to persist the data of the MongoDB container even after the container is stopped or removed.
volumes:
  db-data: